<div class="auth-wrap">
  <div class="auth-box">
    @if ((error$ | async) && (error$ | async) !== '') {
    <div class="auth-error" role="alert">
    {{ error$ | async }}
    </div>
    }
    <form (ngSubmit)="submit()" [formGroup]="form">
      <div [class.field--error]="usernameCtrl.invalid && usernameCtrl.touched" class="field">
        <label class="field__label" for="username">Login</label>
        <input
          autocomplete="username"
          class="field__input"
          formControlName="username"
          id="username"
          placeholder="your_username"
          type="text"
        />
        @if (usernameCtrl.invalid && usernameCtrl.touched) {
        <span class="field__error">{{ getUsernameError() }}</span>
        }
      </div>

      <div [class.field--error]="passwordCtrl.invalid && passwordCtrl.touched" class="field">
        <label class="field__label" for="password">Password</label>
        <input
          autocomplete="current-password"
          class="field__input"
          formControlName="password"
          id="password"
          placeholder="••••••••"
          type="password"
        />
        @if (passwordCtrl.invalid && passwordCtrl.touched) {
        <span class="field__error">{{ getPasswordError() }}</span>
        }
      </div>

      <button
        [disabled]="(loading$ | async)"
        class="auth-btn"
        type="submit"
      >
        @if (loading$ | async) {
        Signing in
        } @else {
        SignIn
        }
      </button>
    </form>

    <p class="auth-hint">
      Demo: <strong>anton / anton123</strong>
    </p>
  </div>
</div>
