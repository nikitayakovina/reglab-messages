<div class="profile-wrap">
  <header class="profile-header">
    <button class="back-btn" (click)="goBack()">Back</button>
    <h1 class="profile-header__title">User Profile</h1>
  </header>

  @if (currentUser$ | async; as user) {
    <div class="profile-body">

      <div class="avatar">{{ getInitial(user.username) }}</div>

      <div class="field">
        <div class="field__label">Username</div>
        <div class="field__value">{{ user.username }}</div>
      </div>

      <div class="field">
        <div class="field__label">User ID</div>
        <div class="field__value field__value--mono field__value--muted">{{ user.id }}</div>
      </div>

      <div class="field">
        <div class="field__label">Status</div>
        <div class="status-badge">
          <span class="status-badge__dot status-badge__dot--on"></span>
          Online
        </div>
      </div>

      <div class="field field--spaced">
        <button class="logout-btn" (click)="logout()">Log Out →</button>
      </div>

    </div>
  }

</div>
